[project]
name = "citation-chat-ui"
version = "2.0.0"
description = "Chat UI that refuses uncited answers — attach source documents, retrieve grounded snippets, and render citation chips on every assistant reply."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
